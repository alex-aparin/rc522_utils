; rc522_utils — read the UID from an old fob and write it onto a blank
; magic card to restore your own broken pass/key.
;
; Board: Arduino Uno. Reader: RC522 over SPI.
;
; RC522 -> Uno wiring:
;   SDA/SS -> D10
;   SCK    -> D13
;   MOSI   -> D11
;   MISO   -> D12
;   RST    -> D9
;   3.3V   -> 3.3V   (POWER IS 3.3 V ONLY!)
;   GND    -> GND

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = miguelbalboa/MFRC522@^1.4.11
build_flags =
    -D RC522_SS_PIN=10
    -D RC522_RST_PIN=9

; Host-side unit tests for lib/uidcore (no board needed):  pio test -e native
; The same tests also run on the Uno itself:               pio test -e uno
[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra
